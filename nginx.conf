events {
    # Sets the maximum number of simultaneous connections
    worker_connections 1024;
}

http {
    server {
        # Listen for standard web traffic
        listen 80;
        
        # Accept traffic from any domain name (wilddetection.com) or IP
        server_name _; 

        location / {
            # Route the traffic to the 'web' container on port 5000
            proxy_pass http://web:5000;
            
            # Pass important information about the visitor to your Python app
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }
    }
}